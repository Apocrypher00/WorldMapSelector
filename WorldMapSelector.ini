[General]
; Valid levels: Trace, Debug, Info, Warn, Err, Critical, Off
LogLevel=Info

[Controls]
; DirectInput keyboard code in hexadecimal (0x00 through 0xFF).
; Key code reference: https://community.bistudio.com/wiki/DIK_KeyCodes
; 0x44 is F10. Set to 0x00 to disable the built-in chooser hotkey.
OpenSelectorKey=0x44

[Behavior]
; Open the selected map immediately when choosing outside MapMenu.
OpenMapAfterSelection=true

; Keep an explicit map selection after MapMenu closes.
; When false, the selection applies to one map session.
PersistSelection=true

; Allow the chooser hotkey outside MapMenu.
; Set to false to reserve the hotkey for use while viewing a map.
AllowChooserOutsideMap=true

; Allow the chooser hotkey while MapMenu is already visible.
AllowChooserWhileMapOpen=true

[Compatibility]
; Comma-separated worldspace EditorIDs to omit from the map chooser.
; Matching is case-insensitive. Leave the value empty to allow every worldspace.
;
; Opening Falskaar remotely can prevent later world transitions from completing.
ExcludedWorldspaces=Falskaar
